name: Deploy Harbor Jelly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check dist/app3d.js
          node --check dist/scene-director.js
          node --check dist/characters.js
          node --check dist/stories.js
          node --check dist/atmosphere.js
          node --check dist/harbor.js
          node --check dist/harbor-world.js
          node --check dist/harbor-sim.js
          node --check dist/harbor-motion.js
          node --check dist/nature.js
          node --check dist/nature-world.js
          node --check dist/landscape-math.js
          node --check dist/forest.js
          node --check dist/forest-world.js
          node --check dist/forest-math.js
          npm test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
